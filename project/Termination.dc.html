<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Раздел 14 — Прекращение действия договора страхования</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-labelledby="sec-term-end" style="width: 1040px; box-sizing: border-box; background: #FFFFFF; font-family: 'Golos Text', system-ui, sans-serif; color: #1F1A1B; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <span style="width: 28px; height: 28px; border-radius: 8px; background: #A0172F; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">14</span>
    <h2 id="sec-term-end" style="margin: 0; font-size: 20px; font-weight: 700; color: #1F1A1B">Прекращение действия договора страхования (Полиса-оферты)</h2>
  </div>
  <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
      <li style="display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #EFE2E5">
        <span style="font-size: 13px; font-weight: 700; color: #A0172F">{{it.num}}</span>
        <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #4A4244; font-family: Arial, sans-serif">{{it.text}}</p>
      </li>
    </sc-for>
  </ol>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"refusal":{"editor":"enum","options":["period","days30","credit353"],"default":"period","section":"Отказ от договора"},"credit":{"editor":"boolean","default":false,"section":"Отказ от договора"},"$preview":{"width":1040,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const ref = this.props.refusal || 'period';
    const cr = this.props.credit === true || this.props.credit === 'true';
    const r2 = {
      period: 'Договор страхования (Полис-оферта) досрочно прекращает свое действие в случае отказа Страхователя — физического лица от Договора страхования (Полиса-оферты) в течение срока, установленного Указанием ЦБ РФ № 3854-У от 20.11.2015 г., и при отсутствии событий, имеющих признаки страхового случая. Размер и порядок возврата уплаченной страховой премии определены вышеуказанным нормативно-правовым актом.',
      days30: 'Договор страхования (Полис-оферта) досрочно прекращает свое действие в случае отказа Страхователя — физического лица от Договора страхования (Полиса-оферты) в течение 30 календарных дней со дня его заключения, в соответствии с п. 2 Указания ЦБ РФ № 3854-У от 20.11.2015 г., и при отсутствии событий, имеющих признаки страхового случая, тогда, когда это предусмотрено вышеуказанным законодательством. Размер и порядок возврата уплаченной страховой премии определены вышеуказанным нормативно-правовым актом.',
      credit353: 'Договор страхования досрочно прекращает свое действие в случае отказа Страхователя — физического лица от договора страхования в течение срока, установленного Указанием ЦБ РФ № 3854-У от 20.11.2015 г. или Федеральным законом от 21.12.2013 г. № 353-ФЗ, и при отсутствии событий, имеющих признаки страхового случая, тогда, когда это предусмотрено вышеуказанным законодательством. Размер и порядок возврата уплаченной страховой премии определены вышеуказанными нормативно-правовыми актами.'
    };
    const t = [
      'Если после заключения Договора страхования (Полиса-оферты) будет установлено, что Страхователь сообщил заведомо ложные сведения при его заключении, то Страховщик вправе потребовать признания Договора страхования (Полиса) недействительным и применения последствий, предусмотренных п. 2 ст. 179 Гражданского кодекса Российской Федерации.',
      r2[ref] || r2.period,
      'При отказе Страхователя от договора страхования в связи с непредоставлением, предоставлением неполной или недостоверной информации о Договоре страхования, в соответствии с Указанием ЦБ РФ от 29.03.2022 № 6109-У, и при отсутствии до момента отказа от страхования событий, имеющих признаки страхового случая, путем подачи письменного заявления об отказе, страховая премия по договору страхования подлежит возврату (за вычетом части страховой премии, исчисляемой пропорционально времени, в течение которого действовало страхование) в срок, не превышающий 7 (семи) рабочих дней со дня получения Страховщиком письменного заявления Страхователя об отказе от договора страхования.',
      'Договор страхования (Полис-оферта) прекращается до наступления срока, на который он был заключен, если после его вступления в силу возможность наступления страхового случая отпала и существование страхового риска прекратилось по обстоятельствам иным, чем страховой случай. При этом Страховщик возвращает Страхователю часть оплаченной страховой премии пропорционально времени до истечения установленного договором срока его действия при отсутствии в период действия договора страхования событий, имеющих признаки страхового случая.'
    ];
    if (cr) t.push('При отказе Страхователя от договора страхования в связи с полным досрочным исполнением его обязательств по договору кредита (займа) и при отсутствии в период действия договора страхования событий, имеющих признаки страхового случая, уплаченная страховая премия возвращается в течение 7 (семи) рабочих дней со дня получения письменного заявления об отказе от Договора страхования, за вычетом части страховой премии, исчисляемой пропорционально времени, в течение которого действовало страхование.');
    const last = '14.' + t.length;
    t.push('При отказе Страхователя — физического лица от договора страхования в иных случаях, чем указано в пп. 14.2 – ' + last + ' настоящего Договора страхования (Полиса-оферты), страховая премия возврату не подлежит.');
    return { items: t.map((x, i) => ({ num: '14.' + (i + 1) + '.', text: x })) };
  }
}
</script>
</body>
</html>
