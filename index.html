<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полис-оферта КАСКО — прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--bordo:#BF0D3E;--ink:#1F1A1B;--muted:#6E6366;--line:#E8DFE1;--bg:#EEEAE7;--side:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Golos Text',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:300px minmax(0,1fr)}
#side{height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 14px 40px;position:sticky;top:0}
#side h1{margin:0 6px 4px;font-size:15px;line-height:1.3;color:var(--bordo)}
#side p.sub{margin:0 6px 14px;font-size:12px;color:var(--muted)}
#nav .grp,#side .grp{margin:14px 0 4px;padding:0 6px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8A7479}
#nav a{display:block;padding:6px 8px;border-radius:8px;font-size:13px;line-height:1.35;color:var(--ink);text-decoration:none}
#nav a:hover{background:#F8F5F2}
#nav a.on{background:var(--bordo);color:#fff}
#nav a.doc{font-weight:700}
#nav details summary{cursor:pointer;list-style:none}
#nav details summary::-webkit-details-marker{display:none}
#nav details summary::before{content:'▸ ';color:#8A7479}
#nav details[open] summary::before{content:'▾ '}
#main{min-width:0;overflow:auto;padding:28px}
#stage{display:flex;flex-direction:column;align-items:center;gap:28px}
.sheet{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);border-radius:4px;overflow:hidden}
.cap{align-self:center;font-size:12px;color:var(--muted);margin-bottom:-18px}
.err{color:var(--bordo);font-size:14px}
@media (max-width:900px){body{grid-template-columns:1fr}#side{position:static;height:auto}}
</style>
</head>
<body>
<aside id="side">
  <h1>Полис-оферта КАСКО</h1>
  <p class="sub">Прототип с вариативностью: переключатели в документе работают</p>
  <nav id="nav"></nav>
</aside>
<main id="main"><div id="stage"></div></main>
<script src="runtime.js"></script>
<script>
(async function () {
  const nav = document.getElementById('nav');
  const stage = document.getElementById('stage');
  const canvas = await (await fetch('project/canvas.json')).json();
  const DOCS = {
    'doc-kasko': { title: 'КАСКО — документ целиком', files: ['Main', 'Page2', 'Page3', 'Page4', 'Page5', 'Page6'] },
    'doc-box': { title: '«Коробка-конструктор» — документ целиком', files: ['Box-P1', 'Box-P2', 'Box-P3', 'Box-P4', 'Box-P5', 'Box-P6'] }
  };
  const pageName = {};
  canvas.pages.forEach((p) => { pageName[p.id] = p.name; });
  const groups = {};
  for (const [file, b] of Object.entries(canvas.boards)) {
    if (!file.endsWith('.dc.html') || file.startsWith('Note-')) continue;
    const pid = b.page || canvas.pages[0].id;
    (groups[pid] = groups[pid] || []).push({ name: file.replace(/\.dc\.html$/, ''), title: b.title || file, x: b.x, y: b.y });
  }
  let html = '<div class="grp">Документ</div>';
  for (const [id, d] of Object.entries(DOCS)) html += '<a class="doc" href="#' + id + '">' + d.title + '</a>';
  for (const p of canvas.pages) {
    const list = (groups[p.id] || []).sort((a, b) => (a.x - b.x) || (a.y - b.y));
    if (!list.length) continue;
    html += '<details' + (p.id === 'page-1' ? '' : '') + '><summary class="grp">' + p.name + ' · ' + list.length + '</summary>';
    for (const it of list) html += '<a href="#' + encodeURIComponent(it.name) + '">' + it.title.replace(/</g, '&lt;') + '</a>';
    html += '</details>';
  }
  nav.innerHTML = html;

  async function show() {
    const id = decodeURIComponent(location.hash.slice(1)) || 'doc-kasko';
    nav.querySelectorAll('a').forEach((a) => {
      const on = decodeURIComponent(a.getAttribute('href').slice(1)) === id;
      a.classList.toggle('on', on);
      if (on && a.closest('details')) a.closest('details').open = true;
    });
    const files = DOCS[id] ? DOCS[id].files : [id];
    stage.replaceChildren();
    try {
      for (const f of files) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        stage.appendChild(sheet);
        const def = await DC.mount(f, sheet);
        if (def.w) sheet.style.width = def.w + 'px';
      }
      document.title = (DOCS[id] ? DOCS[id].title : (canvas.boards[id + '.dc.html'] || {}).title || id) + ' — прототип';
      document.querySelector('main').scrollTop = 0;
    } catch (e) {
      stage.innerHTML = '<p class="err">Не удалось открыть: ' + String(e.message || e) + '</p>';
    }
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
