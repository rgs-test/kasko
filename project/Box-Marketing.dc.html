<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Коробка-конструктор — маркетинговый блок (QR и согласие на рекламу)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-labelledby="sec-mkt" style="width: 1040px; box-sizing: border-box; background: #FFFFFF; font-family: 'Golos Text', system-ui, sans-serif; color: #1F1A1B; display: flex; flex-direction: column; gap: 12px">
  <h3 id="sec-mkt" style="margin: 0; padding-bottom: 8px; border-bottom: 1px solid #EFE2E5; font-size: 17px; line-height: 1.3; font-weight: 700; color: #1F1A1B">Специальные предложения</h3>
  <div style="display: flex; align-items: center; gap: 24px; padding: 18px 24px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8DFE1">
    <div style="flex: none; display: flex; align-items: center; gap: 14px">
      <svg aria-label="QR-код партнера" role="img" width="88" height="88" viewBox="0 0 21 21" shape-rendering="crispEdges" style="flex: none"><rect width="21" height="21" fill="#FFFFFF"></rect><path fill="#1F1A1B" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zM15 1v5h5V1zM16 2h3v3h-3zM0 14h7v7H0zM1 15v5h5v-5zM2 16h3v3H2zM8 0h1v1H8zM10 0h2v1h-2zM9 1h1v2H9zM11 2h2v1h-2zM8 4h2v1H8zM12 4h1v2h-1zM8 6h1v1H8zM10 6h1v1h-1zM0 8h2v1H0zM3 8h1v1H3zM5 8h3v1H5zM9 8h2v1H9zM13 8h1v2h-1zM15 8h2v1h-2zM18 8h3v1h-3zM1 10h2v1H1zM4 10h1v2H4zM6 10h3v1H6zM10 10h2v1h-2zM14 10h1v1h-1zM16 10h1v2h-1zM19 10h2v1h-2zM0 12h1v1H0zM2 12h1v1H2zM7 12h2v1H7zM10 12h1v2h-1zM12 12h2v1h-2zM15 12h1v1h-1zM18 12h1v2h-1zM8 14h1v2H8zM11 14h3v1h-3zM15 14h2v1h-2zM20 14h1v1h-1zM9 16h2v1H9zM12 16h1v2h-1zM14 16h1v1h-1zM17 16h3v1h-3zM8 18h1v1H8zM10 18h1v3h-1zM14 18h2v1h-2zM19 18h2v1h-2zM8 20h1v1H8zM12 20h3v1h-3zM16 20h2v1h-2zM20 20h1v1h-1z"></path></svg>
      <div style="width: 210px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700; color: #1F1A1B">Предложения для владельцев {{brand}}</span><span style="font-size: 12px; line-height: 1.35; color: #6E6366">Наведите камеру на QR-код</span></div>
    </div>
    <span aria-hidden="true" style="flex: none; align-self: stretch; width: 1px; background: #EFE2E5"></span>
    <label style="flex: 1 1 0; min-width: 0; display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: start; cursor: pointer">
      <input type="checkbox" checked="{{agree}}" onChange="{{toggle}}" style="width: 16px; height: 16px; margin: 2px 0 0; accent-color: #A0172F; cursor: pointer">
      <span style="margin: 0; font-size: 13px; line-height: 1.55; color: #4A4244; font-family: Arial, sans-serif">Даю согласие ПАО СК «Росгосстрах» и партнеру на получение рекламной информации о продуктах и услугах по телефону, SMS и электронной почте, указанным в Полисе-оферте, в соответствии со <span style="color: #A0172F; font-weight: 700">ст. 18 Федерального закона от 13.03.2006 № 38-ФЗ «О рекламе»</span>. Согласие действует до его отзыва; отозвать его можно в любой момент, направив заявление Страховщику.</span>
    </label>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand": {"editor": "text", "default": "Москвич", "section": "Маркетинг"}, "agree": {"editor": "boolean", "default": false, "section": "Маркетинг"}, "$preview": {"width": 1040, "height": 190}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { agree: null };
  }
  renderVals() {
    const a = this.props.agree;
    const on = this.state.agree ?? (a === true || a === 'true');
    return { brand: this.props.brand || 'Москвич', agree: on, toggle: () => this.setState({ agree: !on }) };
  }
}
</script>
</body>
</html>
