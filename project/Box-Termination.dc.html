<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Коробка-конструктор — раздел 13: прекращение договора</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-labelledby="sec-term-end" style="width: 1040px; box-sizing: border-box; background: #FFFFFF; font-family: 'Golos Text', system-ui, sans-serif; color: #1F1A1B; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <span style="width: 28px; height: 28px; border-radius: 8px; background: #BF0D3E; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{num}}</span>
    <h2 id="sec-term-end" style="margin: 0; font-size: 20px; font-weight: 700; color: #1F1A1B">Прекращение действия договора страхования (Полиса-оферты)</h2>
  </div>
  <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
      <li style="display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #EFE2E5">
        <span style="font-size: 13px; font-weight: 700; color: #BF0D3E">{{it.num}}</span>
        <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #4A4244; font-family: Arial, sans-serif">{{it.text}}</p>
      </li>
    </sc-for>
  </ol>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"num": {"editor": "text", "default": "13", "section": "Раздел"}, "credit": {"editor": "enum", "options": ["none", "security", "nsExtra"], "default": "none", "section": "Кредит"}, "ns": {"editor": "boolean", "default": true, "section": "Кредит"}, "$preview": {"width": 1040, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const N = String(p.num || '13');
    const cr = p.credit || 'none';
    const ns = !(p.ns === false || p.ns === 'false');
    const credit = cr !== 'none';
    const t = [];
    t.push('Если после заключения Договора страхования (Полиса-оферты) будет установлено, что Страхователь сообщил заведомо ложные сведения при его заключении, Страховщик вправе потребовать признания Договора страхования недействительным и применения последствий, предусмотренных п. 2 ст. 179 Гражданского кодекса Российской Федерации.');
    t.push('Договор страхования досрочно прекращает свое действие в случае отказа Страхователя — физического лица от Договора страхования в течение срока, установленного Указанием Банка России от 20.11.2015 № 3854-У или Федеральным законом от 21.12.2013 № 353-ФЗ, при отсутствии событий, имеющих признаки страхового случая. Размер и порядок возврата уплаченной страховой премии определяются указанными нормативными правовыми актами.');
    t.push('При отказе Страхователя от Договора страхования в связи с непредоставлением, предоставлением неполной или недостоверной информации о Договоре страхования в соответствии с Указанием Банка России от 29.03.2022 № 6109-У' + (ns && credit ? ' (а в части риска «Несчастный случай» при страховании заемщика — также Указанием Банка России № 6139-У)' : '') + ', при отсутствии до момента отказа событий, имеющих признаки страхового случая, страховая премия возвращается за вычетом части, исчисляемой пропорционально времени, в течение которого действовало страхование, в срок не более 7 (семи) рабочих дней со дня получения Страховщиком письменного заявления об отказе.');
    t.push('Договор страхования прекращается до наступления срока, на который он был заключен, если после его вступления в силу возможность наступления страхового случая отпала и существование страхового риска прекратилось по обстоятельствам иным, чем страховой случай. Страховщик возвращает Страхователю часть страховой премии пропорционально времени, оставшемуся до окончания срока страхования, при отсутствии в период действия Договора событий, имеющих признаки страхового случая.');
    if (cr === 'security') t.push('При отказе Страхователя от Договора страхования, заключенного в обеспечение исполнения обязательств по договору потребительского кредита (займа), в связи с полным досрочным исполнением обязательств по такому договору и при отсутствии событий, имеющих признаки страхового случая, страховая премия возвращается за вычетом части, исчисляемой пропорционально времени, в течение которого действовало страхование, в течение 7 (семи) рабочих дней со дня получения Страховщиком письменного заявления об отказе.');
    if (cr === 'nsExtra' && ns) t.push('При отказе Страхователя от страхования по риску «Несчастный случай», оформленного как дополнительная услуга при предоставлении потребительского кредита (займа), в связи с полным досрочным исполнением обязательств по договору кредита (займа) и при отсутствии событий, имеющих признаки страхового случая, страховая премия по этому риску возвращается за вычетом части, исчисляемой пропорционально времени, в течение которого действовало страхование, в течение 7 (семи) рабочих дней со дня получения Страховщиком письменного заявления об отказе.');
    if (credit && ns) t.push('Страхователь вправе отказаться от страхования по риску «Несчастный случай» в течение 14 (четырнадцати) календарных дней со дня заключения Договора страхования. В этом случае страховая премия по данному риску возвращается в полном объеме в течение 7 (семи) рабочих дней со дня получения Страховщиком письменного заявления об отказе.');
    const last = N + '.' + t.length;
    t.push('При отказе Страхователя от Договора страхования в иных случаях, чем указано в пп. ' + N + '.2 – ' + last + ' настоящего Полиса-оферты, страховая премия возврату не подлежит.');
    t.push('Заявление об отказе от Договора страхования подается Страхователем лично в офисе Страховщика, направляется почтой по адресу, указанному на сайте Страховщика, или в дирекцию филиала Страховщика. Датой отказа считается дата подачи заявления, а при направлении через АО «Почта России» — дата почтового штемпеля.');
    return { num: N, items: t.map((x, i) => ({ num: N + '.' + (i + 1) + '.', text: x })) };
  }
}
</script>
</body>
</html>
